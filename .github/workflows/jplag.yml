name: JPlag (сходство решений)

# Тяжёлый прогон: скачивает лаб-ветки приватных студенческих репо, гоняет JPlag
# и выкладывает на доску ТОЛЬКО сводку (имена, проценты, имена файлов) — исходный
# код студентов живёт во временном раннере и в репозиторий не попадает. Поэтому
# workflow не реагирует на pull_request и вообще не исполняет чужой код.
#
# Полные отчёты (.jplag: совпавшие фрагменты кода, кластеры, side-by-side) в этом
# репозитории не остаются: артефакты публичного репо качаются кем угодно. Они уходят
# release-ассетами в приватный intropy24/jplag-reports — видны только участникам оргa.
# Смотреть (вьювер jplag.github.io не годится — он под старый формат, а с 6.3.0
# формат новый): скачать lab-NN.jplag из релиза и рядом с jar запустить
#   java -jar tools/jplag-6.3.0-jar-with-dependencies.jar -M VIEW lab-NN.jplag
# встроенный в jar вьювер отдаёт совместимый интерфейс на http://localhost:1996;
# файл обрабатывается локально, ничего никуда не загружается.
#
# Публикация = коммит src/jplag-summary.json; откат — git revert того коммита.
# После изменения summary пингуется refresh.yml, борд перерисовывается сразу.

on:
  schedule:
    # раз в сутки на всякий случай; cron GitHub'а historically ненадёжен,
    # основной способ — ручной запуск или пинг с локальной машины
    - cron: "3 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jplag
  cancel-in-progress: false

jobs:
  jplag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r src/requirements.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"  # JPlag 6.3.0 собран под Java 25 (class file 69.0), 21 не стартует

      - uses: actions/cache@v4
        with:
          path: src/tools
          key: jplag-jar-6.3.0

      - uses: actions/cache@v4
        with:
          # ветки обновляются чаще, чем мы что-то кэшируем по ключу: ключ уникальный
          # на прогон, restore-keys цепляет самый свежий прошлый кэш, экономя трафик
          path: src/jplag-src
          key: jplag-src-${{ github.run_id }}
          restore-keys: jplag-src-

      - name: Прогон JPlag
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_ORG: intropy24
        run: python src/jplag_check.py

      - name: Опубликовать summary
        id: pub
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if git diff --quiet -- src/jplag-summary.json; then
            echo "summary без изменений"
            exit 0
          fi
          git config user.name "intropy24-bot"
          git config user.email "bot@intropy24.local"
          git add src/jplag-summary.json
          git commit -m "⚖️ jplag: авто-обновление summary"
          # actions/checkout уже вписал свой extraheader (Bearer GITHUB_TOKEN);
          # второй Authorization git передал бы списком — GitHub отвечает 400,
          # поэтому сначала снимаем раннеровский заголовок
          git config --unset-all http.https://github.com/.extraheader || true
          AUTH=$(printf 'x-access-token:%s' "$GH_PAT" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            push https://github.com/intropy24/infoboard.git HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Пинг обновления бора
        if: steps.pub.outputs.changed == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/intropy24/infoboard/actions/workflows/refresh.yml/dispatches \
            -d '{"ref":"main"}'

      - name: Отчёты JPlag в приватный jplag-reports
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          cd src/jplag-reports
          if ! ls lab-*/*.jplag >/dev/null 2>&1; then echo "нет отчётов — пропускаем"; exit 0; fi
          # каждый .jplag самодостаточен (zip с overview.json внутри), вьювер ест его
          # напрямую — внешний zip на релизе только сбивает с толку. Вьюверу не нужен
          # и _src с полными исходниками: в .jplag уже есть фрагменты совпадений.
          tmp=/tmp/jplag-assets; rm -rf "$tmp"; mkdir -p "$tmp"
          for f in lab-*/*.jplag; do
            # lab-01/all.jplag → lab-01.jplag: имя ассета = имя лабы, тянуть без распаковки
            cp "$f" "$tmp/$(basename "$(dirname "$f")").jplag"
          done
          du -h "$tmp"/*.jplag
          gh release create "reports-${{ github.run_number }}" \
            --repo intropy24/jplag-reports \
            --title "Отчёты JPlag — прогон #${{ github.run_number }}" \
            --notes "Смотреть: java -jar jplag-6.3.0-jar-with-dependencies.jar -M VIEW lab-NN.jplag → http://localhost:1996 (хостовый вьювер не годится — он под старый формат)" \
            "$tmp"/*.jplag
          # накопление не бесконечное: держим последние 10 прогонов (список — от новых к старым)
          gh release list --repo intropy24/jplag-reports --limit 100 --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[10:][].tagName' | while read -r tag; do
            gh release delete "$tag" --repo intropy24/jplag-reports --cleanup-tag --yes
            echo "удалён старый релиз $tag"
          done
