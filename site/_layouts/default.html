<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <!-- страница сама перезагружается с той же частотой, что и обновляется отчёт -->
    <meta http-equiv="refresh" content="1800">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>intropy24</title>
    <style>
      :root {
        --bg: #ffffff; --fg: #1f2328; --border: #d0d7de; --th: #f6f8fa;
        --stripe: #fafbfc; --code: #eff1f3; --link: #0969da; --muted: #656d76;
      }
      /* тёмная тема: включается сама по системной теме, если пользователь не выбрал свою */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0d1117; --fg: #e6edf3; --border: #30363d; --th: #161b22;
          --stripe: #10151c; --code: #1f242c; --link: #4493f8; --muted: #9198a1;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0d1117; --fg: #e6edf3; --border: #30363d; --th: #161b22;
        --stripe: #10151c; --code: #1f242c; --link: #4493f8; --muted: #9198a1;
      }
      body {
        font-family: system-ui, sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem;
        line-height: 1.45; background: var(--bg); color: var(--fg); transition: background .2s, color .2s;
      }
      h1, h2 { margin-top: 1.8em; }
      table { border-collapse: collapse; width: 100%; font-size: 0.92em; display: block; overflow-x: auto; }
      th, td { border: 1px solid var(--border); padding: 4px 9px; text-align: left; }
      th { background: var(--th); }
      tr:nth-child(even) td { background: var(--stripe); }
      code { background: var(--code); padding: 1px 4px; border-radius: 4px; }
      a { color: var(--link); }
      /* ники студентов и ссылки колонки CI — ссылки, но выглядят как текст:
         цвет + тонкий пунктир, синее подчёркивание только при наведении */
      a.student, a.ci { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--muted); }
      a.student:hover, a.ci:hover { color: var(--link); border-bottom: 1px solid var(--link); }
      /* ⚡ график скорости: слева фильтры и список студентов, справа канвас;
         отделён от отчёта сверху; высота ряда = высота списка (график тянется за ним),
         у сайдбар есть потолок — дальше список скроллится внутри себя */
      #speed-wrap { display: flex; gap: 1rem; align-items: stretch; border-top: 1px solid var(--border); margin-top: 2rem; padding-top: 1.3rem; }
      #speed-side { flex: 0 0 190px; display: flex; flex-direction: column; min-height: 0; max-height: 720px; }
      #speed-controls { display: flex; flex-direction: column; gap: .4rem; margin-bottom: .6rem; }
      #speed-controls select { background: var(--th); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; }
      #sp-list { flex: 1; min-height: 0; list-style: none; margin: 0; padding: 0; overflow-y: auto; font-size: .9em; }
      #sp-list li { padding: 3px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #sp-list li:hover { background: var(--th); }
      #sp-list li.on { background: var(--th); box-shadow: inset 0 0 0 1px var(--muted); }
      #sp-list i { display: inline-block; width: .7em; height: .7em; border-radius: 2px; margin-right: .45em; }
      /* переключатель метрики Y: шесть кнопок — сеткой 3×2, иначе сайдбар раздувает в ширину */
      #sp-mode { display: grid; grid-template-columns: repeat(3, 1fr); gap: .3rem; }
      #sp-mode button { font: inherit; font-size: .78em; padding: 4px 3px; cursor: pointer; background: var(--bg); color: var(--muted); border: 1px solid var(--border); border-radius: 6px; }
      #sp-mode button.on { background: var(--th); color: var(--fg); border-color: var(--muted); }
      /* фильтр по времени: рамку диапазона тянут мышью прямо по графику */
      #sp-times { display: flex; flex-direction: column; gap: .35rem; font-size: .82em; color: var(--muted); }
      #sp-times label { position: relative; display: flex; gap: .3rem; align-items: stretch; }
      #sp-times input { flex: 1; min-width: 0; box-sizing: border-box; background: var(--th); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 3px 5px; font: inherit; }
      /* пустое поле выглядит нейтрально: только тусклый плейсхолдер, никакой нативной «mm/dd/yyyy» */
      #sp-times input::placeholder { color: var(--muted); opacity: .55; }
      #sp-times input.bad { border-color: #d1242f; }
      /* под текстовым полем лежит прозрачный datetime-local: у него штатный календарь,
         который вызывают кнопкой 📅 (showPicker), а в поле — наш дд.мм формат */
      #sp-times input[type="datetime-local"] { position: absolute; left: 0; right: 36px; top: 0; height: 100%; opacity: 0; pointer-events: none; }
      #sp-times .sp-cal { font-size: .95em; padding: 0 7px; cursor: pointer; background: var(--bg); color: var(--muted); border: 1px solid var(--border); border-radius: 6px; }
      #sp-times .sp-cal:hover { border-color: var(--muted); color: var(--fg); }
      #sp-reset, #sp-scale { font: inherit; padding: 2px 10px; cursor: pointer; background: var(--bg); color: var(--muted); border: 1px solid var(--border); border-radius: 6px; }
      #sp-reset:hover, #sp-scale:hover { border-color: var(--muted); color: var(--fg); }
      .sp-ctl-row { display: flex; gap: .3rem; }
      #sp-jb-thr { align-items: center; }
      #jb-min-edge { flex: 1; min-width: 0; accent-color: #f85149; }
      #jb-min-edge-lbl { font-size: .8em; color: var(--muted); white-space: nowrap; }
      #speed-box { flex: 1 1 auto; min-width: 0; min-height: 440px; position: relative; }
      /* канвасы вынесены из потока: тогда высота #speed-box задаётся рядом (stretch),
         а не самим канвасом — иначе Chart.js и контент тянули бы друг друга по кругу;
         у heatmap размер задан явно: canvas — replaced-элемент, и без width/height
         занял бы CSS-размер своей битовой картой (bitmap×dpr), уезжая за box и мышь */
      #speed-canvas { position: absolute; inset: 0; }
      #speed-heat { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
      #speed-mx { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
      #sp-heat-info, #sp-mx-info { display: none; position: absolute; left: 38px; right: 10px; bottom: 2px; font-size: .78em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      /* ⚖️ режимы JPlag внутри ⚡-виджета: канвас гистограммы (масштабирует Chart.js)
         и канвас графа (размер задаём явно — урок heatmap, иначе битмап уезжает за box) */
      #speed-jb { position: absolute; inset: 0; display: none; }
      #speed-jbg { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
      #sp-jb-info { display: none; position: absolute; left: 38px; right: 10px; bottom: 2px; font-size: .78em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      @media (max-width: 720px) { #speed-wrap { flex-direction: column; } #speed-side { flex: none; width: 100%; max-height: none; } #sp-list { flex: 0 0 auto; max-height: 10rem; } }
      #theme-toggle {
        position: fixed; top: .6rem; right: .6rem; cursor: pointer; font-size: 1.15rem;
        background: var(--th); color: var(--fg); border: 1px solid var(--border); border-radius: 8px;
        padding: 2px 9px; line-height: 1.6;
      }
      #theme-toggle:hover { border-color: var(--muted); }
    </style>
    <script>
      // выбор темы переживает автообновление страницы (meta refresh): храним в localStorage;
      // применяем до отрисовки body, чтобы не было вспышки светлого фона
      (function () {
        var saved = localStorage.getItem("infoboard-theme");
        if (saved === "dark" || saved === "light") document.documentElement.dataset.theme = saved;
      })();
    </script>
  </head>
  <body>
    <button id="theme-toggle" title="Переключить светлую/тёмную тему" onclick="
      var r = document.documentElement;
      var cur = r.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      var next = cur === 'dark' ? 'light' : 'dark';
      r.dataset.theme = next;
      localStorage.setItem('infoboard-theme', next);">🌓</button>
    {{ content }}
  </body>
</html>
